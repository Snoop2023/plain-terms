<article class="term">
  <header>
    <h1>{{term_zh}}<span class="en">{{term_en}}</span></h1>
    <div class="badges">
      <span class="badge {{verdict}}">{{verdict_mark}} {{verdict_note}}</span>
      <span class="chip">{{category}}</span>
      {{aliases}}
    </div>
  </header>

  <section class="field plain">
    <h2>人话</h2>
    <p>{{plain}}</p>
  </section>

  {{fields}}

  <section class="comments">
    <h2>评论区<span class="count">{{comment_count}}</span></h2>
    {{comments}}
    <p class="empty">你的理解跟上面哪条不一样？<a href="{{new_comment_url}}">在 GitHub 上补一条</a> —— 背景不同的人各说一遍，下一个人就懂了。</p>
  </section>

  <section class="field" style="margin-top:2rem">
    <h2>动手改</h2>
    <p style="font-size:.92rem;color:var(--muted)">
      <a href="{{edit_url}}">编辑这个词条</a> ·
      <a href="{{related_url}}">看看同一章里的其它词</a>
    </p>
  </section>
</article>
